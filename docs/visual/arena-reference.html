<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aster Loom · Arena viva</title>
<style>
body{margin:0;background:#080e18;color:#e8eee8;font:15px system-ui;padding:24px}h1{font-size:28px;letter-spacing:.1em;margin:0}p{color:#9caeaf;max-width:820px;line-height:1.6}button{padding:10px 18px;color:#d7fff0;background:#1b343e;border:1px solid #526d72;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,450px),1fr));gap:18px;margin-top:22px}article{background:#0d1624;border:1px solid #2b3c4c;border-radius:8px;overflow:hidden}h2{font-size:14px;font-weight:500;padding:0 18px;color:#b8c6c4}canvas{display:block;width:100%}
</style>
<h1>ASTER LOOM</h1><p>Bastidor de contención articulado. Placas suspendidas, cavidades, luz conducida y un espacio central abierto. Los cuatro paneles utilizan ArenaView, el renderer del juego.</p>
<button id="play">Animar / congelar</button><div class="grid"></div>
<script type="module">
import { Application } from 'pixi.js';
import { ArenaView } from '../../src/presentation/pixi/ArenaView.ts';
import { ArenaModel } from '../../src/simulation/ArenaModel.ts';
let playing=false;
document.querySelector('#play').onclick=()=>playing=!playing;
for(const [label,time,light] of [['01 / Círculo · bastidor completo',0,false],['02 / Hexágono · ensamblaje angular',135,false],['03 / Aviso · nueva frontera',132.9,false],['04 / Contraste · fondo claro',0,true]]){
 const article=document.createElement('article');article.innerHTML='<h2>'+label+'</h2>';document.querySelector('.grid').append(article);
 const app=new Application();await app.init({width:720,height:720,background:light?0x93a6ad:0x090f1d,antialias:true,resolution:1});article.append(app.canvas);
 const view=new ArenaView();view.root.position.set(-280,0);app.stage.addChild(view.root);
 const model=new ArenaModel();model.update(time);view.render(model.state);
 // Seeking into a run must not leave a frozen expansion wave in a still panel.
 for(let i=0;i<6;i++)view.update(0.1);
 view.render(model.state);
 app.ticker.add(t=>{if(playing){view.update(t.deltaMS/1000);if(time>132&&time<133)model.update(t.deltaMS/1000);view.render(model.state);}});
}
document.body.dataset.ready='true';
</script></html>
