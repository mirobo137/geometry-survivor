<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#080b17" />
    <meta name="description" content="Geometry Survivor: prototipo web de supervivencia geométrica." />
    <title>Geometry Survivor</title>
  </head>
  <body>
    <main id="game-container" aria-label="Geometry Survivor">
      <div id="boot-status" role="status" aria-live="assertive">Cargando juego…</div>
      <div id="game-hud" aria-label="Estado de la partida" hidden>
        <span id="hud-time">00:00</span>
        <span id="hud-health">HP 100/100</span>
        <span id="hud-xp">XP 0</span>
        <span id="hud-kills">K 0</span>
        <span id="hud-level">LV 1</span>
      </div>
      <section id="level-up" aria-labelledby="level-up-title" hidden>
        <p>LEVEL UP</p>
        <h1 id="level-up-title">Nivel 2</h1>
        <div id="level-up-options"></div>
      </section>
      <section id="pause-overlay" aria-labelledby="pause-title" hidden>
        <p>PAUSA</p>
        <h1 id="pause-title">Partida pausada</h1>
        <span id="pause-message">La partida se detuvo al salir de la ventana.</span>
        <button id="pause-resume" type="button">Continuar</button>
      </section>
      <section id="game-over" aria-labelledby="game-over-title" hidden>
        <p>RUN COMPLETE</p>
        <h1 id="game-over-title">Fin de la partida</h1>
        <div id="game-over-stats" aria-live="polite">
          <span id="game-over-time">Tiempo 00:00</span>
          <span id="game-over-kills">Bajas 0</span>
          <span id="game-over-experience">Experiencia 0</span>
          <span id="game-over-score">Puntuación 0</span>
          <span id="game-over-best">Mejor 00:00 · 0 puntos</span>
        </div>
        <button id="game-over-restart" type="button">Jugar de nuevo</button>
      </section>
      <div id="debug-panel" hidden></div>
    </main>
    <script>
      (function () {
        function showBootError(message) {
          var status = document.getElementById('boot-status');
          if (!status) return;
          status.hidden = false;
          status.setAttribute('data-state', 'error');
          status.textContent = 'No se pudo iniciar el juego. ' + (message || 'Recarga la página.');
        }

        window.addEventListener('error', function (event) {
          showBootError(event.message || 'Error al cargar los archivos.');
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showBootError(reason && reason.message ? reason.message : String(reason || 'Error de inicialización.'));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
