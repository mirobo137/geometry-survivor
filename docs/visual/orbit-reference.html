<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Aegis — referencia de órbita</title>
<style>
body{margin:0;background:#090d19;color:#e8e5dc;font:15px system-ui;padding:24px}
h1{font-size:26px;margin:0}p{color:#adb7ca;max-width:760px}
button{background:#27344d;color:white;border:1px solid #64728a;padding:10px 18px;border-radius:6px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:24px}
article{border:1px solid #344056;border-radius:10px;overflow:hidden;background:#121c30}
h2{font-size:14px;padding:0 16px}canvas{width:100%;display:block}
</style>
<h1>PRISM AEGIS / órbita geométrica</h1>
<p>Renderer real del juego: carcasa facetada, apertura oscura, núcleo energético,
halo segmentado y estela tangencial breve. Low conserva la identidad y reduce
decoración móvil; no se modifica daño ni colisión.</p>
<button id="play">Animar / congelar</button>
<div class="grid"></div>
<script type="module">
import { Application, Graphics } from 'pixi.js';
import { WeaponView } from '../../src/presentation/pixi/WeaponView.ts';

const cases = [
  ['High · seis módulos orbitales', 'high', 6, false],
  ['Medium · lectura de combate', 'medium', 3, false],
  ['Low · identidad conservada', 'low', 3, false],
  ['Fondo claro · contraste del núcleo', 'high', 3, true]
];
let playing = false;
document.querySelector('#play').onclick = () => { playing = !playing; };

for (const [label, quality, count, light] of cases) {
  const article = document.createElement('article');
  article.innerHTML = '<h2>' + label + '</h2>';
  document.querySelector('.grid').append(article);
  const app = new Application();
  await app.init({ width: 540, height: 260, background: light ? 0xd9dfe4 : 0x101a30, antialias: true, resolution: 1 });
  article.append(app.canvas);
  const anchor = new Graphics();
  anchor.beginPath().circle(270, 130, 45).stroke({ color: light ? 0x4e5b70 : 0x344c73, width: 1, alpha: 0.8 });
  anchor.beginPath().moveTo(260, 130).lineTo(280, 130).stroke({ color: light ? 0x27344d : 0x75e6ff, width: 1, alpha: 0.55 });
  anchor.beginPath().moveTo(270, 120).lineTo(270, 140).stroke({ color: light ? 0x27344d : 0x75e6ff, width: 1, alpha: 0.55 });
  app.stage.addChild(anchor);
  const view = new WeaponView(app.renderer, undefined, quality);
  app.stage.addChild(view.root);
  const orbitBlades = Array.from({ length: 6 }, () => ({ active: false, x: 270, y: 130, radius: 10, angle: 0 }));
  const combat = { orbitBlades, chainSegments: [] };
  let age = 0.4;
  const render = () => {
    for (let index = 0; index < orbitBlades.length; index += 1) {
      const active = index < count;
      const angle = age * 2.7 + (index / Math.max(1, count)) * Math.PI * 2;
      orbitBlades[index].active = active;
      orbitBlades[index].angle = angle;
      orbitBlades[index].x = 270 + Math.cos(angle) * 82;
      orbitBlades[index].y = 130 + Math.sin(angle) * 82;
    }
    view.render(combat);
  };
  render();
  app.ticker.add((ticker) => {
    if (!playing) return;
    age += ticker.deltaMS / 1000;
    render();
  });
}
document.body.dataset.ready = 'true';
</script>
</html>
