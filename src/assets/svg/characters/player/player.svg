<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-32 -32 64 64"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="player-title player-desc">
  <title id="player-title">Núcleo geométrico del jugador</title>
  <desc id="player-desc">Nave compacta vista desde arriba, con núcleo, anillo exterior y dos emisores.</desc>

  <ellipse id="player-shadow" cx="0" cy="5" rx="25" ry="16" fill="#ffffff" opacity="0.42"/>
  <g id="player-outer-ring" fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle id="player-outer-ring-circle" cx="0" cy="0" r="25" stroke-width="2.2"/>
    <path id="player-outer-ring-notch" d="M0-29v7M0 22v7M-29 0h7M22 0h7" stroke-width="2.6"/>
  </g>
  <g id="player-weapons" fill="#ffffff" stroke="#ffffff" stroke-linejoin="round">
    <path id="player-weapon-left" d="M-17-5l-10-6 2 13z" stroke-width="1.4"/>
    <path id="player-weapon-right" d="M17-5l10-6-2 13z" stroke-width="1.4"/>
  </g>
  <g id="player-body" fill="#ffffff" stroke="#ffffff" stroke-linejoin="round">
    <path id="player-body-shell" d="M0-20 18-10 18 10 0 20-18 10-18-10z" stroke-width="2.6"/>
    <path id="player-body-panel" d="M0-14 11-7 11 7 0 14-11 7-11-7z" fill="none" stroke-width="1.4" opacity="0.78"/>
  </g>
  <g id="player-core" fill="#ffffff" stroke="#ffffff" stroke-linejoin="round">
    <circle id="player-core-orb" cx="0" cy="0" r="8" stroke-width="1.6"/>
    <path id="player-core-cross" d="M0-5v10M-5 0h10" fill="none" stroke-width="1.4"/>
  </g>
  <g id="player-accent" fill="#ffffff">
    <circle id="player-accent-left" cx="-14" cy="0" r="2"/>
    <circle id="player-accent-right" cx="14" cy="0" r="2"/>
  </g>
</svg>
